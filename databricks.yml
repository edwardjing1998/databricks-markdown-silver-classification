bundle:
  name: markdown-silver-classification

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m build --wheel
    dynamic_version: true

variables:
  catalog:
    default: education_rag
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  model_endpoint:
    description: Databricks Model Serving endpoint used by ai_query
    default: system.ai.gpt-oss-20b
  enable_ai:
    description: Set true to classify ambiguous sections with ai_query
    default: "true"
  confidence_threshold:
    default: "0.85"
  prompt_version:
    default: v1

targets:
  development:
    mode: development
    default: true
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
  qa:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  production:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
