name: Deploy and run Silver classification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Databricks target
        required: true
        type: choice
        options:
          - development
          - qa
          - production
        default: development
      enable_ai:
        description: Classify ambiguous sections with the AI endpoint
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: markdown-silver-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Silver job to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build Python wheel
        run: python -m build --wheel

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks authentication configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABRICKS_HOST
            DATABRICKS_CLIENT_ID
            DATABRICKS_CLIENT_SECRET
            DATABRICKS_AUTH_TYPE
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is empty."
              exit 1
            fi
          done

          if [[ ! "$DATABRICKS_HOST" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DATABRICKS_HOST has an invalid format."
            exit 1
          fi

          echo "Databricks host: $DATABRICKS_HOST"
          echo "Client ID length: ${#DATABRICKS_CLIENT_ID}"
          echo "Client secret length: ${#DATABRICKS_CLIENT_SECRET}"
          echo "Authentication type: $DATABRICKS_AUTH_TYPE"
          echo "Secret values were not displayed."

      - name: Verify Databricks OAuth authentication
        shell: bash
        run: |
          set -euo pipefail
          databricks auth describe
          databricks current-user me --output json

      - name: Validate bundle
        run: |
          databricks bundle validate \
            --target "${{ inputs.environment }}" \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="enable_ai=${{ inputs.enable_ai }}"

      - name: Deploy bundle
        run: |
          databricks bundle deploy \
            --target "${{ inputs.environment }}" \
            --auto-approve \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="enable_ai=${{ inputs.enable_ai }}"

      - name: Run Silver job
        run: |
          databricks bundle run markdown_silver_classification \
            --target "${{ inputs.environment }}" \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="enable_ai=${{ inputs.enable_ai }}"